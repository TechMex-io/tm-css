<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/tm-css/elemental/dist/styles.min.css">
  <link rel="stylesheet" href="/tm-css/demo/transitions.css">
  <title>Transitions</title>
  <style>
    button {
      padding: 0;
      border: none;
      background: none;
    }

    picture:has(img) {
      aspect-ratio: 1;
      vertical-align: bottom;
    }

    :where(#lightbox) {
      /* remove browser default styles */
      border: none;
      padding: 0;

      /* popover transition in/out */
      &,
      &::backdrop {
        transition:
          display .5s allow-discrete,
          overlay .5s allow-discrete,
          transform .5s,
          opacity .5s;
        opacity: 0;
      }

      /* open state */
      &:popover-open {
        opacity: 1;
        transform: scale(1);

        &::backdrop {
          opacity: 1;
        }
      }

      /* offstage styles */
      @starting-style {

        &:popover-open,
        &:popover-open::backdrop {
          opacity: 0;
        }
      }

      /* only scale if it's ok with the user */
      @media (prefers-reduced-motion: no-preference) {
        transform: scale(.95);
      }

      /* neat radial vignette backdrop style */
      &::backdrop {
        background-image: radial-gradient(#0003, 25%, #000e);
      }

      /* light-box image sizing */
      >img {
        display: flex;
        max-inline-size: 100%;
        block-size: auto;
      }
  </style>
</head>

<body>

  <main>
    this is index

    <p><a href="/tm-css/examples/transitions/">page 1</a></p>
    <p><a href="/tm-css/examples/transitions/page2">page 2</a></p>
    <p><a href="/tm-css/examples/transitions/page3">page 3</a></p>
  </main>

  <section>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=1" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=2" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=3" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=4" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=5" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=6" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=7" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=8" alt="">
      </picture>
    </button>
    <button light-box>
      <picture>
        <img src="https://picsum.photos/300/300?v=9" alt="">
      </picture>
    </button>

  </section>



  <figure id="lightbox" popover></figure>

  <script>
    const images = document.querySelectorAll('[light-box]');
    const section = document.querySelector('section');
    const state = {
      open: false
    }

    // get section diemensions
    const rect = section.getBoundingClientRect();



    images.forEach(image => {
      image.addEventListener('click', () => {
        if (!state.open) {
          // send the picture to the handling function for showing the popover
          handleLightbox(image)
        }
      });
    });

    function handleLightbox(image) {
      lightbox.innerHTML = image.querySelector(':scope img').outerHTML
      lightbox.style.width = rect.width + 'px';

      lightbox.showPopover();
    }

    lightbox.addEventListener('toggle', e => {
      state.open = e.newState === 'open'
    });
  </script>

</body>

</html>
